name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test tests/AgendaReminder.Core.Tests -c Release

      - name: Publish (exe autonome)
        run: >
          dotnet publish src/AgendaReminder.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: AgendaReminder-win-x64
          path: publish/AgendaReminder.exe
