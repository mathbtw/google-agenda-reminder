name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publier une Release avec cette version (ex. 1.0.0). Laisser vide pour un simple build."
        required: false
        default: ""

permissions:
  contents: write # pour publier une Release quand un tag v* est poussé

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ inputs.release_version }}" -ne "") { $v = "${{ inputs.release_version }}".TrimStart('v') }
          elseif ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = "1.0.${{ github.run_number }}" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: dotnet test tests/AgendaReminder.Core.Tests -c Release

      - name: Publish (dossier pour l'installateur)
        run: >
          dotnet publish src/AgendaReminder.App -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Qp "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\AgendaReminder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Version portable (un seul exe)
        run: >
          dotnet publish src/AgendaReminder.App -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o portable

      - uses: actions/upload-artifact@v4
        with:
          name: AgendaReminder-Setup
          path: dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AgendaReminder-portable
          path: portable/AgendaReminder.exe

      - name: Release GitHub
        if: github.ref_type == 'tag' || inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          # Crée le tag vX.Y.Z sur le commit construit s'il n'existe pas encore.
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Agenda Reminder ${{ steps.version.outputs.value }}
          files: |
            dist/*.exe
            portable/AgendaReminder.exe
          generate_release_notes: true
          body: |
            ## Installation
            Téléchargez **AgendaReminder-Setup-${{ steps.version.outputs.value }}.exe** ci-dessous et lancez-le (aucun droit administrateur requis).
            `AgendaReminder.exe` seul = version portable, sans installation.

            Windows SmartScreen peut avertir (exe non signé) : *Informations complémentaires → Exécuter quand même*.
            Configuration Google : voir le [README](https://github.com/${{ github.repository }}#installation).
